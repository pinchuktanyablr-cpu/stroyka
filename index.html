<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стройка Тани</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#3a2a2e;--cream:#fffaf2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1016;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
  justify-content:space-between;padding:max(24px,env(safe-area-inset-top)) 28px 28px}
.glass{pointer-events:auto;background:rgba(255,250,242,.72);backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:24px;
  box-shadow:0 24px 70px rgba(40,14,24,.35),inset 0 1px 0 rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.4)}
#panel{width:min(400px,86vw);padding:22px 26px;color:var(--ink)}
#panel .ttl{font-size:13px;font-weight:700;letter-spacing:5px;color:#b55c3c}
#panel .sub{font-size:12.5px;color:#8a6a5e;margin:3px 0 12px}
#panel .big{font-size:46px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
#panel .of{font-size:14px;color:#8a6a5e;margin:4px 0 14px}
#bar{height:12px;background:rgba(90,40,20,.12);border-radius:6px;overflow:hidden}
#barfill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#e0954f,#f0c43c);
  box-shadow:0 0 14px rgba(240,196,60,.6);transition:width 1.8s cubic-bezier(.2,.8,.2,1)}
#panel .pct{margin-top:9px;font-size:12.5px;color:#8a6a5e}
#chips{display:flex;gap:10px;align-self:flex-start;flex-wrap:wrap}
.chip{pointer-events:auto;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  color:var(--ink);cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:scale(.96)}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);padding:12px 22px;
  border-radius:16px;font-size:14.5px;font-weight:600;color:var(--ink);opacity:0;
  transition:opacity .4s,transform .4s;text-align:center;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud,#hint{transition:opacity .7s}
body.cinema #hud,body.cinema #hint{opacity:0;pointer-events:none}
#hint{position:absolute;right:28px;top:max(26px,env(safe-area-inset-top));padding:10px 16px;
  font-size:12.5px;color:var(--ink);opacity:.85;border-radius:14px}
@media(max-width:620px){#panel .big{font-size:36px}#hint{display:none}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="panel" class="glass">
    <div class="ttl">СТРОЙКА</div>
    <div class="sub" id="subline">твоя трёшка · Минск</div>
    <div class="big"><span id="num">$0</span></div>
    <div class="of" id="ofline">из $42 000 на взнос</div>
    <div id="bar"><div id="barfill"></div></div>
    <div class="pct" id="pctline"></div>
  </div>
  <div id="chips">
    <div class="chip glass" id="c-story">▶️ Моя история</div>
    <div class="chip glass" id="c-brick">🧱 Подать кирпич</div>
    <div class="chip glass" id="c-light">💡 Зажечь окна</div>
    <div class="chip glass" id="c-time">🌗 Время суток</div>
    <div class="chip glass" id="c-weather">🌦 Погода</div>
    <div class="chip glass" id="c-room">🛋 Комната</div>
    <div class="chip glass" id="c-roof">🌃 Крыша</div>
    <div class="chip glass" id="c-lamp" style="display:none">💡 Торшер</div>
    <div class="chip glass" id="c-cat" style="display:none">🐈 Погладить Марса</div>
  </div>
</div>
<div id="hint" class="glass">двигай мышкой — сцена дышит · кликай по сцене</div>
<div id="toast" class="glass"></div>
<script>
'use strict';
// ── Telegram Mini App ──
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){TG.ready();TG.expand();
  try{TG.setHeaderColor('#1a1016');TG.setBackgroundColor('#1a1016')}catch(e){}
  try{TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}}
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
if(IS_TOUCH){const h=document.getElementById('hint');if(h)h.style.display='none'}
function haptic(style){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred(style||'light')}catch(e){}}
// ── данные: приватно из #hash (бот вшивает их в кнопку меню), в публичной версии — демо ──
let D={fund:0,milestone:42000,target:140000,days_ok:0,streak:0,workers:1,
  eta:"впереди",season:"autumn",bricks:0,site_days:0,cement:{level:1,flag:1}};
try{
  const h=location.hash.slice(1);
  if(h.startsWith('d=')){
    const raw=atob(h.slice(2).replace(/-/g,'+').replace(/_/g,'/'));
    D=Object.assign(D,JSON.parse(decodeURIComponent(escape(raw))));
  }
}catch(e){}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1,OX=0,OY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  // cover-посадка логической сцены 1280×720
  SC=Math.max(W/1280,H/720);
  OX=(W-1280*SC)/2;OY=(H-720*SC)/2;
}
addEventListener('resize',resize);resize();

// ── параллакс за курсором ──
let mx=0,my=0,tx=0,ty=0;
addEventListener('mousemove',e=>{tx=(e.clientX/W-.5)*2;ty=(e.clientY/H-.5)*2});
addEventListener('touchmove',e=>{const t=e.touches[0];tx=(t.clientX/W-.5)*2;ty=(t.clientY/H-.5)*2},{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma!==null){tx=Math.max(-1,Math.min(1,e.gamma/28));ty=Math.max(-1,Math.min(1,(e.beta-48)/28))}});

// ── время суток (реальное, с ручным переключением) ──
const PARTS=['dawn','day','dusk','night'];
function autoPart(){const h=new Date().getHours();return h>=5&&h<=8?'dawn':h<=17?'day':h<=21?'dusk':'night'}
let dayIdx=PARTS.indexOf(autoPart()), SKY={
 dawn:[[248,'#2a2440'],[180,'#7a4a66'],[120,'#d87a88'],[60,'#f8c8a8'],[0,'#fbe8c8']],
 day:[[248,'#7ab8e8'],[150,'#a8d4f4'],[70,'#d8ecf8'],[0,'#f4e8d0']],
 dusk:[[248,'#f8e7c4'],[190,'#f4a978'],[130,'#e08268'],[70,'#a85f6e'],[0,'#6e4a66']],
 night:[[248,'#0a1230'],[160,'#16214a'],[80,'#283458'],[0,'#3a3a60']]};
// палитры: [яркость сцены, цвет тумана]
const MOOD={dawn:[.92,'rgba(255,200,210,.30)'],day:[1,'rgba(255,245,230,.26)'],
  dusk:[.9,'rgba(255,225,200,.32)'],night:[.55,'rgba(120,130,190,.14)']};

// ── состояние сцены ──
const pct=Math.min(1,D.fund/D.milestone);
let litExtra=0;                       // «зажечь окна»
let weather='rain';                   // реальная погода Тани сегодня
const t0=performance.now();

// кран: полный рабочий цикл (поворот → захват → перенос → укладка)
const crane={phase:'idle',t:0,angle:0.12,carry:false};
const laid=[];                        // уложенные кирпичи поверх стены
function craneStart(){if(crane.phase==='idle'){crane.phase='toStack';crane.t=0}}

// кино «моя история»
const story={on:false,t0:0};
let letterK=0;

// ── сцены ──
let SCENE='site', sceneFade=0, sceneTo=null;
function gotoScene(s){if(SCENE!==s&&!sceneTo){sceneTo=s;sceneFade=0}}
let lampOn=null;                       // торшер (null = авто по времени)
const hearts=[];                       // сердечки кота
const roomCat={state:'sleep',t:0};     // sleep | stretch
let shoot=null,shootNext=5;            // падающая звезда
const dustSeeds=[...Array(40)].map((_,i)=>({x:(i*73)%500,y:(i*131)%400,ph:(i*29)%6}));
// салют
let fw=[];
function burst(x,y){for(let i=0;i<26;i++){const a=i/26*6.283,v=120+Math.random()*130;
  fw.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,hue:(i*47)%360})}}

// кот на заборе и стая птиц
let catX=-80,catOn=false,catNext=9,flock=null,flockNext=6;

// дождь
const drops=[...Array(150)].map(()=>({x:Math.random()*1400-60,y:Math.random()*760,v:560+Math.random()*220}));
const splashes=[];

// звук «тук» при укладке
let AC=null;
function thock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=96;g.gain.setValueAtTime(.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.14);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}

// частицы: листья
const leaves=[...Array(26)].map((_,i)=>({x:Math.random()*1380-50,y:Math.random()*760-40,
  v:40+Math.random()*60,ph:Math.random()*6,r:Math.random()*6.28}));
const stars=[...Array(70)].map((_,i)=>({x:(i*167)%1280,y:(i*97)%300+8,ph:(i*13)%6}));

// плёночное зерно (офскрин-шум)
const noiseCv=document.createElement('canvas');noiseCv.width=noiseCv.height=256;
{const nctx=noiseCv.getContext('2d'),img=nctx.createImageData(256,256);
 for(let i=0;i<img.data.length;i+=4){const v=120+Math.random()*120;
   img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}
 nctx.putImageData(img,0,0)}

// кино-камера
const cam={z:1.04,x:640,y:380};
function camUpdate(now){
  let z=1.04+0.012*Math.sin((now-t0)/9000), cx=640, cy=380, shake=0;
  if(story.on){
    const sT=(now-story.t0)/1000, es=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
    if(sT<2.2){z=1.08+0.3*es(sT/2.2);cx=640+220*es(sT/2.2);cy=380+60*es(sT/2.2)}
    else if(sT<3.6){z=1.38;cx=860;cy=440}
    else if(sT<9.4){const k=es((sT-3.6)/5.8);z=1.38-0.2*k;cx=860-40*k;cy=440-70*k}
    else{const k=es((sT-9.4)/2.4);z=1.18-0.14*k;cx=820-120*k;cy=370;shake=3*(1-k)}
  }
  cam.z+=(z-cam.z)*0.06;cam.x+=(cx-cam.x)*0.06;cam.y+=(cy-cam.y)*0.06;
  cam.sx=(Math.random()-0.5)*shake;cam.sy=(Math.random()-0.5)*shake;
}

// ── помощники рисования ──
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lg(x1,y1,x2,y2,stops){const g=ctx.createLinearGradient(x1,y1,x2,y2);
  for(const[o,c]of stops)g.addColorStop(o,c);return g}

function drawScene(now){
  const t=(now-t0)/1000;
  // кино «моя история»
  let pdraw=pct, ghost=0, caption=null, subcap=null;
  if(story.on){
    const sT=(now-story.t0)/1000, es=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
    if(sT<2.2){pdraw=pct*es(sT/2.2);caption='Твой путь';subcap='$0 → $13 000 за 9 дней дневника'}
    else if(sT<3.6){pdraw=pct;caption='СЕГОДНЯ · $13 000';subcap='фундамент залит, идёт первый этаж'}
    else if(sT<9.4){pdraw=pct;ghost=pct+(1-pct)*es((sT-3.6)/5.8);
      const g5=ghost*5;
      if(g5<2.4){caption='≈ январь 2027';subcap='первый этаж построен'}
      else if(g5<3.4){caption='≈ октябрь 2027';subcap='второй этаж — больше половины!'}
      else if(g5<4.4){caption='≈ май 2028';subcap='третий этаж готов'}
      else{caption='лето–осень 2028';subcap='КРЫША — взнос собран целиком'}}
    else if(sT<13){pdraw=pct;ghost=1;caption='ВЗНОС СОБРАН ♥';subcap='новоселье близко — продолжай строить';
      if(Math.random()<0.05)burst(500+Math.random()*500,160+Math.random()*160)}
    else{story.on=false;document.body.classList.remove('cinema');toast('Это твоя история. Каждое «отложила» — её новая серия 💛')}
  }
  const part=PARTS[dayIdx], [bright,haze]=MOOD[part];
  mx+=(tx-mx)*0.05; my+=(ty-my)*0.05;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  function sceneSite(){
  // небо
  const g=ctx.createLinearGradient(0,0,0,H);
  const sky=SKY[part], top=sky[0][0];
  for(const[yy,c]of sky)g.addColorStop(Math.min(1,1-yy/260),c);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(OX,OY);ctx.scale(SC,SC);
  // кино-камера
  camUpdate(now);
  ctx.translate(640,380);ctx.scale(cam.z,cam.z);
  ctx.translate(-cam.x+(cam.sx||0),-cam.y+(cam.sy||0));

  const P=(k)=>({x:mx*14*k,y:my*8*k});   // слойный параллакс

  // звёзды ночью
  if(part==='night'){for(const s of stars){
    ctx.globalAlpha=.4+.4*Math.sin(t*1.6+s.ph);
    ctx.fillStyle='#fff8e8';ctx.beginPath();ctx.arc(s.x+P(0.2).x,s.y+P(0.2).y,1.5,0,7);ctx.fill()}
    ctx.globalAlpha=1}

  // солнце/луна
  const sp=P(0.25);
  if(part==='night'){
    const grd=ctx.createRadialGradient(1060+sp.x,130+sp.y,10,1060+sp.x,130+sp.y,90);
    grd.addColorStop(0,'rgba(250,244,220,1)');grd.addColorStop(.35,'rgba(240,230,190,.9)');grd.addColorStop(1,'rgba(240,230,190,0)');
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(1060+sp.x,130+sp.y,90,0,7);ctx.fill();
  }else{
    const sunx={dawn:220,day:640,dusk:1040}[part],suny={dawn:330,day:120,dusk:250}[part];
    const grd=ctx.createRadialGradient(sunx+sp.x,suny+sp.y,8,sunx+sp.x,suny+sp.y,150);
    grd.addColorStop(0,'rgba(255,250,225,1)');grd.addColorStop(.25,'rgba(255,222,135,.95)');grd.addColorStop(1,'rgba(255,200,110,0)');
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(sunx+sp.x,suny+sp.y,150,0,7);ctx.fill();
  }

  // облака: мягкие пятна-мазки
  for(let i=0;i<5;i++){
    const cp=P(0.3+i*0.08);
    const cx=((i*300+t*(5+i*2.5))%1500)-110+cp.x, cy=46+i*36+cp.y;
    const cw=130+i*22;
    const cg=ctx.createRadialGradient(cx,cy,6,cx,cy,cw);
    const base=part==='night'?'110,120,160':'255,248,238';
    cg.addColorStop(0,`rgba(${base},${part==='night'?0.30:0.55})`);
    cg.addColorStop(.6,`rgba(${base},${part==='night'?0.16:0.30})`);
    cg.addColorStop(1,`rgba(${base},0)`);
    ctx.fillStyle=cg;
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,0.32);ctx.beginPath();ctx.arc(0,0,cw,0,7);ctx.fill();ctx.restore();
  }

  // скайлайн Минска на горизонте
  {const kp=P(0.45);ctx.globalAlpha=0.5*bright;
   const sx=kp.x*0.5, sy=430+kp.y*0.3, col=part==='night'?'#3a3850':'#9a7a84';
   ctx.fillStyle=col;
   // библиотека-алмаз
   ctx.save();ctx.translate(960+sx,sy-36);ctx.rotate(0.785);ctx.fillRect(-26,-26,52,52);ctx.restore();
   ctx.fillRect(954+sx,sy-18,16,26);
   // высотки и труба
   ctx.fillRect(840+sx,sy-52,30,60);ctx.fillRect(884+sx,sy-34,22,42);
   ctx.fillRect(1060+sx,sy-44,26,52);ctx.fillRect(1100+sx,sy-26,34,34);
   ctx.fillRect(160+sx,sy-64,14,72);ctx.fillRect(210+sx,sy-38,36,46);ctx.fillRect(300+sx,sy-50,24,58);
   if(part==='night'){ctx.fillStyle='rgba(255,220,130,.75)';
     for(let i=0;i<14;i++)ctx.fillRect(842+((i*53)%300)+sx,sy-46+((i*29)%40),3,3)}
   ctx.globalAlpha=1}

  // холмы 3 плана + туман
  const hills=[['#d9a284',165,0.35,.45],['#b97a5e',205,0.55,.62],['#9a5e4e',245,0.8,.85]];
  hills.forEach(([c,base,k,al],i)=>{
    const hp=P(k);ctx.globalAlpha=al*bright;
    ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-60,720);
    ctx.lineTo(-60,420+base-160);
    for(let x=-60;x<=1340;x+=20){
      const y=420+base-160+Math.sin(x*0.004+i*2)*38+Math.sin(x*0.009+i)*22;
      ctx.lineTo(x+hp.x*0.4,y+hp.y*0.3);
    }
    ctx.lineTo(1340,720);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    if(i<2){ctx.fillStyle=haze;ctx.fillRect(-60,430+base-150,1400,70)}
  });

  // земля и трава
  ctx.fillStyle=lg(0,570,0,720,[[0,'#9a6a4e'],[1,'#6e4634']]);ctx.fillRect(-300,575,1900,400);
  const gcol={autumn:['#c0a24e','#8a6c2e'],winter:['#eef3f8','#cdd9e6'],spring:['#8fc168','#5c8446'],summer:['#78b655','#4e7e3a']}[D.season];
  ctx.fillStyle=lg(0,560,0,578,[[0,gcol[0]],[1,gcol[1]]]);ctx.fillRect(-60,560,1400,18);

  const fp=P(1);
  ctx.save();ctx.translate(fp.x*0.6,fp.y*0.4);

  // мягкая тень-хелпер
  const shadow=(x,y,rx,ry)=>{const sg=ctx.createRadialGradient(x,y,1,x,y,rx);
    sg.addColorStop(0,'rgba(50,22,30,.30)');sg.addColorStop(1,'rgba(50,22,30,0)');
    ctx.fillStyle=sg;ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.beginPath();
    ctx.arc(0,0,rx,0,7);ctx.fill();ctx.restore()};

  // ── дом ──
  const HX=680,BASE=560,FW=360,FH=90;
  shadow(HX+FW/2,BASE+12,230,26);
  function houseDraw(stagesV,isGhost){
    if(isGhost){ctx.globalAlpha=0.38}
    ctx.fillStyle=lg(0,BASE-24,0,BASE,[[0,'#948a7c'],[1,'#5f574d']]);
    ctx.fillRect(HX-14,BASE-24,FW+28,24);
    for(let fl=0;fl<3;fl++){
      const st=Math.max(0,Math.min(1,stagesV-1-fl));if(st<=0)continue;
      const yT=BASE-24-FH*(fl+1)+FH*(1-st),hh=FH*st;
      // фасад
      ctx.fillStyle=isGhost?'rgba(240,220,200,.85)'
        :lg(HX,0,HX+FW,0,[[0,'#b65f3e'],[0.5,fl%2?'#c96f4a':'#d07a52'],[0.88,'#e09a6a'],[1,'#f0c08a']]);
      ctx.fillRect(HX,yT,FW,hh);
      if(!isGhost){ // кладка + пилястры по углам
        ctx.strokeStyle='rgba(110,53,38,.3)';ctx.lineWidth=1.2;
        for(let yy=yT+12;yy<yT+hh;yy+=13){ctx.beginPath();ctx.moveTo(HX,yy);ctx.lineTo(HX+FW,yy);ctx.stroke()}
        ctx.fillStyle='rgba(255,236,200,.28)';
        ctx.fillRect(HX,yT,14,hh);ctx.fillRect(HX+FW-14,yT,14,hh);
      }
      if(st>0.99){ // межэтажный карниз
        ctx.fillStyle=isGhost?'rgba(160,120,90,.4)':'#a65036';
        ctx.fillRect(HX-7,yT-3,FW+14,7);
        if(!isGhost){ctx.fillStyle='rgba(255,236,200,.5)';ctx.fillRect(HX-7,yT-3,FW+14,2.4)}
      }
      if(st>0.85){
        for(let w=0;w<3;w++){
          const wi=fl*3+w,wy=yT+18;

function rr2(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

(function(){const el=document.getElementById('num');const target=D.fund;const t1=performance.now();
  (function step(n){const k=Math.min(1,(n-t1)/1600);const v=Math.round(target*(1-Math.pow(1-k,3)));
    el.textContent='$'+v.toLocaleString('ru-RU');
    if(k<1)requestAnimationFrame(step)})(t1);
  setTimeout(()=>document.getElementById('barfill').style.width=(pct*100)+'%',250);
})();
document.getElementById('c-brick').onclick=()=>{haptic('medium');if(crane.phase==='idle'){craneStart();toast('Кран пошёл за кирпичом…')}};
function storyMusic(){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(master);
  const notes=[261.63,329.63,392.0,523.25];
  const oscs=notes.map((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
    o.type=i<3?'sine':'triangle';o.frequency.value=f;g.gain.value=i<3?0.3:0.12;
    o.connect(g).connect(lp);o.start();return o});
  const t1=AC.currentTime;
  master.gain.linearRampToValueAtTime(0.055,t1+2.2);
  master.gain.setValueAtTime(0.055,t1+8.8);
  master.gain.linearRampToValueAtTime(0.085,t1+10);     // подъём на финале
  master.gain.linearRampToValueAtTime(0.0001,t1+13.5);
  setTimeout(()=>{const o2=AC.createOscillator(),g2=AC.createGain();   // финальная нота
    o2.type='sine';o2.frequency.value=659.25;g2.gain.setValueAtTime(0.09,AC.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+2.4);
    o2.connect(g2).connect(AC.destination);o2.start();o2.stop(AC.currentTime+2.5)},9600);
  setTimeout(()=>oscs.forEach(o=>o.stop()),13800);
}catch(e){}}
document.getElementById('c-story').onclick=()=>{if(!story.on){story.on=true;story.t0=performance.now();storyMusic();document.body.classList.add('cinema');toast('🎬 Смотри: от сегодня — до новоселья')}};
document.getElementById('c-weather').onclick=()=>{weather=weather==='rain'?'sun':'rain';toast(weather==='rain'?'🌧 Дождь (как в твоём бюджете сегодня)':'☀️ Ясно — так выглядит месяц в лимитах')};
document.getElementById('c-light').onclick=()=>{litExtra=(litExtra+3)%12;toast(litExtra?'Свет в окнах — так будет на $'+(Math.ceil(litExtra/9*140000/1000)*1000).toLocaleString('ru-RU')+'k':'Окна как по накоплениям')};
document.getElementById('c-time').onclick=()=>{dayIdx=(dayIdx+1)%4;toast({dawn:'🌅 Рассвет',day:'☀️ День',dusk:'🌇 Закат',night:'🌙 Ночь'}[PARTS[dayIdx]])};
function updChips(){
  const site=SCENE==='site'&&!sceneTo;
  const room=(sceneTo||SCENE)==='room';
  document.getElementById('c-brick').style.display=site?'':'none';
  document.getElementById('c-light').style.display=site?'':'none';
  document.getElementById('c-weather').style.display=site?'':'none';
  document.getElementById('c-story').style.display=site?'':'none';
  document.getElementById('c-lamp').style.display=room?'':'none';
  document.getElementById('c-cat').style.display=room?'':'none';
  document.getElementById('c-room').textContent=room?'🏗 На стройку':'🛋 Комната';
  document.getElementById('c-roof').textContent=(sceneTo||SCENE)==='roof'?'🏗 На стройку':'🌃 Крыша';
}
document.getElementById('c-room').onclick=()=>{gotoScene(SCENE==='room'?'site':'room');updChips();
  toast(SCENE==='room'?'Возвращаемся на объект 👷':'🛋 Добро пожаловать домой');};
document.getElementById('c-roof').onclick=()=>{gotoScene(SCENE==='roof'?'site':'roof');updChips();
  toast(SCENE==='roof'?'Возвращаемся на объект 👷':'🌃 Лето 2028. Ты дома.');};
document.getElementById('c-lamp').onclick=()=>{lampOn=lampOn===null?true:!lampOn;

document.getElementById('c-cat').onclick=()=>{haptic('light');roomCat.state='stretch';roomCat.t=0;

updChips();
